<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Sin esto, el celular muestra todo a "ancho de escritorio" y lo achica con zoom. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Monitor SAP Dunkin </title>
  <meta name="description" content="Monitor de la integración con SAP Business One para los locales Dunkin.">
  <!-- Es una herramienta interna: que los buscadores no la indexen. -->
  <meta name="robots" content="noindex, nofollow">

  <!-- ===== Ícono y modo app =====
       - Pestaña del navegador: el SVG de abajo (va incluido en este archivo, no hay que subir nada).
       - iPhone/iPad: apple-touch-icon.png (180x180, sin transparencia) en la MISMA carpeta.
       - Android: manifest.webmanifest + icon-192.png / icon-512.png en la MISMA carpeta.
       Si no subes esos archivos, la página funciona igual; solo cambia el ícono del acceso directo. -->
  <meta name="apple-mobile-web-app-title" content="Monitor SAP">
  <meta name="application-name" content="Monitor SAP">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#3B2416">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FF671F'/%3E%3Crect x='10' y='14' width='44' height='30' rx='4' fill='%23fff'/%3E%3Cpolyline points='14,32 22,32 26,22 32,40 36,28 40,32 50,32' fill='none' stroke='%23DA1884' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='26' y='46' width='12' height='4' fill='%23fff'/%3E%3Crect x='20' y='50' width='24' height='4' rx='2' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <style>
    :root {
      --fondo: #3B2416;     /* café oscuro */
      --naranjo: #FF671F;
      --rosado: #DA1884;
      --texto: #FFF6EE;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: var(--fondo);
    }
    #contenedorIframe {
      position: fixed;
      /* En modo app se deja libre la muesca y la barra de gestos
         (en navegador normal o computador estos valores son 0). */
      top: env(safe-area-inset-top, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      left: env(safe-area-inset-left, 0px);
      background: var(--fondo);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      /* Mismo gris del monitor, para que no se vea un destello blanco al cargar */
      background: #efefec;
    }
    @media (prefers-color-scheme: dark) {
      iframe { background: #11171d; }
    }

    /* Pantalla de carga / aviso mientras el monitor no responde */
    #cargando {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 20px;
      padding: 24px;
      background: var(--fondo);
      color: var(--texto);
      font: 600 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      z-index: 5;
      transition: opacity .35s;
    }
    #cargando svg { width: 112px; height: 112px; }
    #cargando .pulso {
      stroke-dasharray: 80;
      stroke-dashoffset: 80;
      animation: trazar 1.6s ease-in-out infinite;
    }
    #cargando small {
      display: block;
      font-weight: 400;
      font-size: 14px;
      opacity: .8;
      max-width: 34em;
      margin: 6px auto 0;
    }
    #cargando.error .pulso { animation: none; stroke-dashoffset: 0; stroke: #9a9a9a; }
    #cargando.listo { opacity: 0; pointer-events: none; }
    #reintentar {
      font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      background: var(--naranjo);
      border: 2px solid #fff;
      border-radius: 999px;
      padding: 10px 22px;
      min-height: 44px;
      cursor: pointer;
    }
    #reintentar:focus-visible { outline: 3px solid var(--rosado); outline-offset: 2px; }
    #reintentar[hidden] { display: none; }
    @keyframes trazar {
      60%  { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -80; }
    }
    @media (prefers-reduced-motion: reduce) {
      #cargando .pulso { animation: none; stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>

  <div id="cargando" role="status" aria-live="polite">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="14" fill="#FF671F"/>
      <rect x="10" y="14" width="44" height="30" rx="4" fill="#fff"/>
      <polyline class="pulso" points="14,32 22,32 26,22 32,40 36,28 40,32 50,32"
                fill="none" stroke="#DA1884" stroke-width="4"
                stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="46" width="12" height="4" fill="#fff"/>
      <rect x="20" y="50" width="24" height="4" rx="2" fill="#fff"/>
    </svg>
    <span><span id="mensaje">Conectando con el monitor SAP…</span>
      <small id="detalle">Si tarda más de unos segundos, revisa que la interfaz esté encendida.</small>
    </span>
    <button id="reintentar" type="button" hidden>Reintentar ahora</button>
  </div>

  <div id="contenedorIframe">
    <iframe id="miIframe" title="Monitor SAP Dunkin" allow="clipboard-write"></iframe>
  </div>

  <noscript>
    <p style="color:#fff;font:16px system-ui;text-align:center;padding:40px">Activa JavaScript para ver el monitor.</p>
  </noscript>

  <script>
    /* ===== URL del monitor =====
       Es el monitor web de la interfaz (puerto monitorPuerto de la empresa). Para que se vea desde
       fuera del servidor, la interfaz debe tener monitorSoloLocal=false y el puerto abierto en el
       firewall de Windows y en Google Cloud.
       Si esta página se publica con https, el monitor también debe ir por https (por ejemplo detrás
       de un proxy con certificado): el navegador bloquea un iframe http dentro de una página https. */
    const URL_MONITOR = 'http://34.176.9.216:8090/';
    const REINTENTO_SEG = 10;

    const iframe = document.getElementById('miIframe');
    const cargando = document.getElementById('cargando');
    const mensaje = document.getElementById('mensaje');
    const detalle = document.getElementById('detalle');
    const reintentar = document.getElementById('reintentar');
    let temporizador = null;

    function mostrarError(titulo, texto) {
      cargando.classList.remove('listo');
      cargando.classList.add('error');
      mensaje.textContent = titulo;
      detalle.textContent = texto;
      reintentar.hidden = false;
    }

    // Página https con monitor http: el navegador lo bloquearía y quedaría en blanco. Se avisa claro.
    const bloqueadoPorHttps = location.protocol === 'https:' && URL_MONITOR.startsWith('http:');

    // Comprueba que el monitor responda (/salud) antes de mostrarlo. Se usa "no-cors": no se lee la
    // respuesta, solo se sabe si el servidor contestó; así no hay que cambiar nada en el monitor.
    async function comprobar() {
      clearTimeout(temporizador);
      if (bloqueadoPorHttps) {
        mostrarError('El monitor no se puede mostrar en esta página',
          'Esta página se abre con https y el monitor va por http, y el navegador lo bloquea. ' +
          'Abre esta página con http, o publica el monitor con https.');
        return;
      }
      cargando.classList.remove('error');
      mensaje.textContent = 'Conectando con el monitor SAP…';
      detalle.textContent = 'Si tarda más de unos segundos, revisa que la interfaz esté encendida.';
      reintentar.hidden = true;

      const control = new AbortController();
      const limite = setTimeout(() => control.abort(), 8000);
      try {
        await fetch(new URL('salud', URL_MONITOR), { mode: 'no-cors', cache: 'no-store', signal: control.signal });
        clearTimeout(limite);
        // Responde: se carga el monitor (solo la primera vez; después él mismo se actualiza solo).
        if (!iframe.src) iframe.src = URL_MONITOR;
        else cargando.classList.add('listo');
      } catch (e) {
        clearTimeout(limite);
        mostrarError('No hay conexión con el monitor SAP',
          'La interfaz puede estar detenida, o este equipo no llega al servidor. ' +
          'Se vuelve a intentar cada ' + REINTENTO_SEG + ' segundos.');
        temporizador = setTimeout(comprobar, REINTENTO_SEG * 1000);
      }
    }

    // Cuando el monitor terminó de cargar, se quita la pantalla de carga.
    // Si después la interfaz se detiene, el propio monitor muestra "Sin conexión" y se reconecta solo.
    iframe.addEventListener('load', () => cargando.classList.add('listo'));
    reintentar.addEventListener('click', comprobar);

    comprobar();
  </script>

</body>
</html>
